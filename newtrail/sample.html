<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Destinations</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .swiper {
            width: 100%;
            overflow: hidden;
            padding: 20px;
        }

        .swiper-slide {
            display: flex;
            /* justify-content: center; */
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            /* width: 30px; */
        }

        .swiper-slide img {
            /* width: 100%; */
            width: 200px;
            height: auto;
            border-radius: 12px;
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .swiper-button {
            cursor: pointer;
            background-color: #754513;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }

        .swiper-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Popular Destinations</h1>
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide" style="width: 10px;">
                    <img src="https://images.pickyourtrail.com/Maldives_min_68eeb59ecf.png?w=20&h=80" alt="Maldives" >
                </div>
                <div class="swiper-slide">
                    <img src="https://images.pickyourtrail.com/Dubai_min_37d495697d.png?w=220&h=180" alt="Dubai">
                </div>
                <div class="swiper-slide">
                    <img src="https://images.pickyourtrail.com/Europe_min_02633788f0.png?w=220&h=180" alt="Europe">
                </div>
                <div class="swiper-slide">
                    <img src="https://images.pickyourtrail.com/Thailand_min_5b98b41c89.png?w=220&h=180" alt="Thailand">
                </div>

                <div class="swiper-slide">
                    <img src="https://images.pickyourtrail.com/Europe_min_02633788f0.png?w=220&h=180" alt="Europe">
                </div>
                <div class="swiper-slide">
                    <img src="https://images.pickyourtrail.com/Thailand_min_5b98b41c89.png?w=220&h=180" alt="Thailand">
                </div>

                <div class="swiper-slide">
                    <img src="https://images.pickyourtrail.com/Europe_min_02633788f0.png?w=220&h=180" alt="Europe">
                </div>
                <div class="swiper-slide">
                    <img src="https://images.pickyourtrail.com/Thailand_min_5b98b41c89.png?w=220&h=180" alt="Thailand">
                </div>
            </div>
        </div>

        <div class="navigation-buttons">
            <button class="swiper-button swiper-prev">Previous</button>
            <button class="swiper-button swiper-next">Next</button>
        </div>
    </div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const swiper = new Swiper('.swiper', {
                slidesPerView: 5,
                spaceBetween: 12,
            });

            const nextButton = document.querySelector('.swiper-next');
            const prevButton = document.querySelector('.swiper-prev');

            nextButton.addEventListener('click', () => swiper.slideNext());
            prevButton.addEventListener('click', () => swiper.slidePrev());

            swiper.on('slideChange', () => {
                prevButton.disabled = swiper.isBeginning;
                nextButton.disabled = swiper.isEnd;
            });

            // Initialize button states
            prevButton.disabled = true;
        });
    </script>
</body>

</html>
